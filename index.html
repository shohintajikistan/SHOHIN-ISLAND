import * as THREE from 'three';

const root=document.getElementById('game'),loading=document.getElementById('loading'),hud=document.getElementById('hud');
try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fcbdc);scene.fog=new THREE.FogExp2(0x9fcbd0,.000105);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,12000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;renderer.setClearColor(0x9bc9d4,1);renderer.domElement.style.imageRendering='auto';root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc8e8ff,0x38513a,1.7));
const sun=new THREE.DirectionalLight(0xffedcf,3.1);sun.position.set(-260,380,-180);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-320;sun.shadow.camera.right=320;sun.shadow.camera.top=320;sun.shadow.camera.bottom=-320;sun.shadow.bias=-.00025;scene.add(sun);
// High-quality tropical ocean: shallow turquoise shelf, deep offshore blue, moving multi-scale waves and scrolling micro-ripples.
function makeWaterNormal(){
 const c=document.createElement('canvas');c.width=c.height=256;const ctx=c.getContext('2d'),im=ctx.createImageData(256,256);
 for(let y=0;y<256;y++)for(let x=0;x<256;x++){
  const i=(y*256+x)*4;
  const n=128+Math.sin(x*.16+Math.sin(y*.075)*2.2)*24+Math.cos(y*.21+x*.055)*19+Math.sin((x+y)*.31)*8;
  im.data[i]=n;im.data[i+1]=n;im.data[i+2]=255;im.data[i+3]=255;
 }
 ctx.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(115,115);t.colorSpace=THREE.NoColorSpace;return t;
}
const oceanNormal=makeWaterNormal();
const seaGeo=new THREE.PlaneGeometry(16000,16000,240,240);
const seaColors=[],shallow=new THREE.Color(0x35b9ad),reef=new THREE.Color(0x087f91),deep=new THREE.Color(0x063c59);
const seaPos=seaGeo.attributes.position;
for(let i=0;i<seaPos.count;i++){
 const d=Math.hypot(seaPos.getX(i),seaPos.getY(i));
 const c=d<2550?shallow.clone().lerp(reef,THREE.MathUtils.smoothstep(d,1850,2550)):reef.clone().lerp(deep,THREE.MathUtils.smoothstep(d,2550,7200));
 const sparkle=(Math.sin(seaPos.getX(i)*.013+seaPos.getY(i)*.009)*.5+.5)*.025;
 c.offsetHSL(0,0,sparkle);seaColors.push(c.r,c.g,c.b);
}
seaGeo.setAttribute('color',new THREE.Float32BufferAttribute(seaColors,3));
const seaMat=new THREE.MeshPhysicalMaterial({vertexColors:true,roughness:.16,metalness:.04,clearcoat:1,clearcoatRoughness:.075,normalMap:oceanNormal,normalScale:new THREE.Vector2(.42,.42)});
seaMat.onBeforeCompile=(shader)=>{
 shader.uniforms.uOceanTime={value:0};
 shader.vertexShader='uniform float uOceanTime;\n'+shader.vertexShader;
 shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
 float oceanX=position.x;
 float oceanZ=position.y;
 float swell=sin(oceanX*0.0024+uOceanTime*0.72)*0.62
            +sin(oceanZ*0.0031-uOceanTime*0.58)*0.34
            +sin((oceanX+oceanZ)*0.006+uOceanTime*1.15)*0.13;

};
const sea=new THREE.Mesh(seaGeo,seaMat);sea.rotation.x=-Math.PI/2;sea.position.y=-2.8;scene.add(sea);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(x,z){let n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n)}
function noise(x,z){let ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz;fx=fx*fx*(3-2*fx);fz=fz*fz*(3-2*fz);return THREE.MathUtils.lerp(THREE.MathUtils.lerp(hash(ix,iz),hash(ix+1,iz),fx),THREE.MathUtils.lerp(hash(ix,iz+1),hash(ix+1,iz+1),fx),fz)}
function heightAt(x,z){
 const u=x/10,v=z/10,r=Math.sqrt(u*u+v*v),edge=clamp((242-r)/52,0,1);if(edge<=0)return -8;
 const n=noise(u*.035,v*.035)*14+noise(u*.09+30,v*.09-20)*4.2;
 const ridge=Math.max(0,1-Math.sqrt((u+55)**2/15000+(v-45)**2/19000));
 const ridge2=Math.max(0,1-Math.sqrt((u-85)**2/8500+(v+65)**2/11000));
 const central=Math.pow(ridge,1.6)*155+Math.pow(ridge2,1.7)*112;
 const peaks=Math.pow(Math.max(0,Math.sin(u*.018+v*.012)*Math.cos(v*.021-u*.009)),3)*22;
 return Math.max(-8,(7+n+central+peaks)*edge-3);
}
const N=240,size=5000,positions=[],colors=[],indices=[];
const colorLow=new THREE.Color(0xc1ad78),colorGrass=new THREE.Color(0x47794a),colorForest=new THREE.Color(0x254e36),colorRock=new THREE.Color(0x777b75),colorSnow=new THREE.Color(0xe4e9e3);
for(let iz=0;iz<=N;iz++)for(let ix=0;ix<=N;ix++){
 const x=(ix/N-.5)*size,z=(iz/N-.5)*size,y=heightAt(x,z);positions.push(x,y,z);
 let c;if(y<2)c=colorLow.clone().lerp(colorGrass,clamp((y+2)/4,0,1));else if(y<34)c=colorGrass.clone().lerp(colorForest,clamp((y-2)/32,0,1));else if(y<92)c=colorForest.clone().lerp(colorRock,clamp((y-34)/58,0,1));else c=colorRock.clone().lerp(colorSnow,clamp((y-92)/34,0,1));
 const variation=(noise(x*.17,z*.17)-.5)*.12;c.offsetHSL(0,0,variation);colors.push(c.r,c.g,c.b);
 if(ix<N&&iz<N){const a=iz*(N+1)+ix,b=a+1,c=a+N+1,d=c+1;indices.push(a,c,b,b,c,d)}
}
const terrainGeo=new THREE.BufferGeometry();terrainGeo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));terrainGeo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));terrainGeo.setIndex(indices);terrainGeo.computeVertexNormals();
// Procedural fine-grain surface maps add texture to the island instead of flat colour.
function makeGroundMaps(){
 const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),im=x.createImageData(256,256);
 for(let y=0;y<256;y++)for(let xx=0;xx<256;xx++){const i=(y*256+xx)*4,n=105+Math.random()*95;im.data[i]=n;im.data[i+1]=n;im.data[i+2]=n;im.data[i+3]=255}
 x.putImageData(im,0,0);const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(32,32);tex.colorSpace=THREE.NoColorSpace;return tex;
}
const groundBump=makeGroundMaps();
const terrainMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.98,bumpMap:groundBump,bumpScale:1.35});
const terrain=new THREE.Mesh(terrainGeo,terrainMat);terrain.receiveShadow=true;terrain.castShadow=true;scene.add(terrain);
// Ultra-dense island grass: 560,000 lightweight instanced blades, without per-blade shadows.
const grassGeo=new THREE.PlaneGeometry(.24,1.25,1,1);
grassGeo.translate(0,.625,0);
const grassMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,side:THREE.DoubleSide});
// Camera-distance visual LOD: nearby blades stay tall and detailed; distant blades become shorter and less visually dominant.
grassMat.onBeforeCompile=(shader)=>{
 shader.vertexShader=shader.vertexShader.replace(
  '#include <common>',
  '#include <common>\\nvarying float vGrassLod;'
 );
 shader.vertexShader=shader.vertexShader.replace(
  '#include <begin_vertex>',
  `#include <begin_vertex>
   vec4 grassWorldCenter = modelMatrix * instanceMatrix * vec4(0.0,0.0,0.0,1.0);
   float grassDistance = distance(cameraPosition, grassWorldCenter.xyz);
   vGrassLod = smoothstep(95.0, 720.0, grassDistance);
   transformed.y *= mix(1.0, 0.22, vGrassLod);
   transformed.x *= mix(1.0, 0.62, vGrassLod);`
 );
 shader.fragmentShader=shader.fragmentShader.replace(
  '#include <common>',
  '#include <common>\\nvarying float vGrassLod;'
 );
 shader.fragmentShader=shader.fragmentShader.replace(
  '#include <color_fragment>',
  '#include <color_fragment>\\ndiffuseColor.rgb *= mix(1.0, 0.76, vGrassLod);'

};
grassMat.customProgramCacheKey=()=> 'shohin-grass-distance-lod-v1';
const GRASS_MAX=560000;
const grass=new THREE.InstancedMesh(grassGeo,grassMat,GRASS_MAX);
grass.frustumCulled=false;
const grassDummy=new THREE.Object3D(),grassColor=new THREE.Color();
let grassCount=0,grassTries=0;
while(grassCount<GRASS_MAX&&grassTries<2600000){
 grassTries++;
 const gx=(Math.random()-.5)*4400,gz=(Math.random()-.5)*4400,gy=heightAt(gx,gz);
 // Cover green slopes and valleys; preserve pale beaches and exposed high rocky peaks.
 if(gy<3.2||gy>78||Math.hypot(gx,gz)>2220)continue;
 const h=.62+Math.random()*1.18,w=.62+Math.random()*.82;
 grassDummy.position.set(gx,gy+.035,gz);
 grassDummy.rotation.set((Math.random()-.5)*.16,Math.random()*Math.PI*2,(Math.random()-.5)*.16);
 grassDummy.scale.set(w,h,1);grassDummy.updateMatrix();
 grass.setMatrixAt(grassCount,grassDummy.matrix);
 const shade=Math.random();
 grassColor.set(shade<.22?0x2d6533:shade<.68?0x438638:shade<.9?0x609d3e:0x83ae50);
 grass.setColorAt(grassCount,grassColor);
 grassCount++;
}
grass.count=grassCount;grass.instanceMatrix.needsUpdate=true;
if(grass.instanceColor)grass.instanceColor.needsUpdate=true;
grass.receiveShadow=false;grass.castShadow=false;scene.add(grass);
// Shoreline sand coves
const sandMat=new THREE.MeshStandardMaterial({color:0xd8c18a,roughness:1,bumpMap:groundBump,bumpScale:.55});
for(let i=0;i<8;i++){const a=i*Math.PI/4+.2,x=Math.cos(a)*1900,z=Math.sin(a)*1900;const patch=new THREE.Mesh(new THREE.CircleGeometry(190,32),sandMat);patch.rotation.x=-Math.PI/2;patch.rotation.z=-a;patch.position.set(x,heightAt(x,z)+.22,z);patch.scale.set(1.5,.75,1);scene.add(patch)}
// Instanced forests: tree counts tuned for mobile
const trunkGeo=new THREE.CylinderGeometry(.35,.55,5,6),leafGeo=new THREE.ConeGeometry(3.2,11,7);
const trunkMat=new THREE.MeshStandardMaterial({color:0x63452d,roughness:1}),leafMat=new THREE.MeshStandardMaterial({color:0x245a39,roughness:.95});
const trunks=new THREE.InstancedMesh(trunkGeo,trunkMat,2600),leaves=new THREE.InstancedMesh(leafGeo,leafMat,2600);trunks.castShadow=true;leaves.castShadow=true;
const dummy=new THREE.Object3D();let count=0,tries=0;
while(count<2600&&tries<26000){tries++;const x=(Math.random()-.5)*4400,z=(Math.random()-.5)*4400,y=heightAt(x,z);if(y<4||y>145||Math.sqrt(x*x+z*z)>2220)continue;
const s=.7+Math.random()*.9;dummy.position.set(x,y+2.4*s,z);dummy.rotation.y=Math.random()*6.28;dummy.scale.set(s,s,s);dummy.updateMatrix();trunks.setMatrixAt(count,dummy.matrix);
dummy.position.y=y+7*s;dummy.scale.set(s,s,s);dummy.updateMatrix();leaves.setMatrixAt(count,dummy.matrix);count++}
trunks.count=count;leaves.count=count;scene.add(trunks,leaves);

// Tropical palms: curved trunks and individually shaped radial fronds, instanced for mobile performance.
function makePalmFrond(){
 const g=new THREE.BufferGeometry(),v=[],idx=[];
 const rows=12,cols=4;
 for(let i=0;i<=rows;i++){const t=i/rows,half=Math.sin(Math.PI*t)*.72*(1-.22*t);for(let j=0;j<=cols;j++){const u=j/cols*2-1;v.push(u*half,t*7.2,-t*t*1.35-Math.abs(u)*.12)}}
 for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){const a=i*(cols+1)+j,b=a+1,c=a+cols+1,d=c+1;idx.push(a,c,b,b,c,d)}
 g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(idx);g.computeVertexNormals();return g;
}
const palmTrunkGeo=new THREE.CylinderGeometry(.2,.48,10,8,5);
const palmTrunkMat=new THREE.MeshStandardMaterial({color:0x80603b,roughness:1});
const palmFrondGeo=makePalmFrond();
const palmLeafMat=new THREE.MeshStandardMaterial({color:0x287c43,roughness:.88,side:THREE.DoubleSide});
const PALM_COUNT=360,FRONDS=8;
const palmTrunks=new THREE.InstancedMesh(palmTrunkGeo,palmTrunkMat,PALM_COUNT);
const palmFronds=new THREE.InstancedMesh(palmFrondGeo,palmLeafMat,PALM_COUNT*FRONDS);
palmTrunks.castShadow=true;palmFronds.castShadow=true;
let pc=0;
for(let i=0;i<PALM_COUNT;i++){
 const x=(Math.random()-.5)*4400,z=(Math.random()-.5)*4400,y=heightAt(x,z);
 if(y<0||y>38||Math.hypot(x,z)>2240)continue;
 const sc=.72+Math.random()*.72,lean=(Math.random()-.5)*.12;
 dummy.position.set(x+lean*5,y+5*sc,z);dummy.rotation.set(lean,Math.random()*6.28,lean*.5);dummy.scale.set(sc,sc,sc);dummy.updateMatrix();palmTrunks.setMatrixAt(pc,dummy.matrix);
 for(let k=0;k<FRONDS;k++){dummy.position.set(x+lean*10,y+9.6*sc,z);dummy.rotation.set(-.22+Math.random()*.12,k/FRONDS*Math.PI*2,Math.random()*.10-.05);dummy.scale.set(sc*(.92+Math.random()*.18),sc,sc);dummy.updateMatrix();palmFronds.setMatrixAt(pc*FRONDS+k,dummy.matrix)}
 pc++;
}
palmTrunks.count=pc;palmFronds.count=pc*FRONDS;scene.add(palmTrunks,palmFronds);
const bushGeo=new THREE.IcosahedronGeometry(1.8,1),bushMat=new THREE.MeshStandardMaterial({color:0x347442,roughness:1});

for(let i=0;i<2400;i++){const x=(Math.random()-.5)*4400,z=(Math.random()-.5)*4400,y=heightAt(x,z);if(y<3||y>110||Math.hypot(x,z)>2200)continue;const sc=.7+Math.random()*2;dummy.position.set(x,y+sc,z);dummy.rotation.set(Math.random(),Math.random()*6,Math.random());dummy.scale.set(sc*1.3,sc*.65,sc);dummy.updateMatrix();bushes.setMatrixAt(bc++,dummy.matrix)}

// Real CC0 glTF assets: loaded once, then cloned for mobile-friendly reuse.
const gltfLoader=new GLTFLoader();
function loadIslandAsset(url, placements, options={}){
 gltfLoader.load(url,(gltf)=>{
  const source=gltf.scene;
  source.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  for(const p of placements){
   const obj=source.clone(true);
   const s=p.scale||1;
   obj.scale.setScalar(s);
   obj.position.set(p.x,heightAt(p.x,p.z)+ (p.lift||0),p.z);
   obj.rotation.y=p.rotation||0;
   scene.add(obj);
  }
 },undefined,err=>console.warn('SHOHIN asset load failed:',url,err));
}
