<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071c16">
<title>SHOHIN ISLAND</title>
<style>
:root{color-scheme:dark;--green:#08a56c;--lime:#baf05b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071c16;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#effff5;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#174b36,#071c16 70%);z-index:10;transition:opacity .8s}
.loadbox{text-align:center;padding:28px}.crown{font-size:38px;color:var(--lime);letter-spacing:8px}.brand{font-weight:900;letter-spacing:4px;font-size:clamp(24px,6vw,42px)}.sub{color:#b4d5c3;letter-spacing:3px;font-size:11px;margin-top:8px}.bar{width:190px;height:3px;background:#244b39;margin:24px auto 0;overflow:hidden;border-radius:5px}.bar:after{content:"";display:block;height:100%;width:40%;background:var(--lime);animation:load 1.1s infinite ease-in-out}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(360%)}}
#hud{position:fixed;inset:0;pointer-events:none;display:none}.top{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.panel{background:linear-gradient(135deg,#071c16dc,#0d3024c9);border:1px solid #8bd5a52e;border-radius:14px;padding:10px 13px;backdrop-filter:blur(10px);box-shadow:0 8px 30px #0003}.logo{font-size:12px;font-weight:900;letter-spacing:2px;color:var(--lime)}.location{font-size:10px;color:#c0d8ca;margin-top:3px}.status{font-size:10px;color:#d6e9dc;text-align:right}.status b{color:var(--lime);font-weight:700}.hint{position:absolute;top:80px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:#e2f1e7;background:#071c1699;padding:7px 11px;border-radius:30px;border:1px solid #ffffff20}
#controls{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:140px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px;pointer-events:none}
#stick{width:116px;height:116px;border-radius:50%;background:#071c1680;border:1px solid #d4f5df55;position:relative;pointer-events:auto;touch-action:none}
#nub{position:absolute;width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#baf05b,#08a56c);border:2px solid #eaffd4;left:33px;top:33px;box-shadow:0 4px 18px #0007}
.actions{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}.act{width:58px;height:58px;border-radius:50%;border:1px solid #d5f5dd66;background:#071c16bb;color:#effff5;font-size:11px;font-weight:800;backdrop-filter:blur(8px)}.act.primary{background:linear-gradient(145deg,#0c9866,#07563d);border-color:#baf05b88}
#cross{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#ffffffaa;transform:translate(-50%,-50%);opacity:.5}
#notice{position:fixed;left:50%;bottom:165px;transform:translateX(-50%);background:#071c16dd;border:1px solid #baf05b55;padding:9px 14px;border-radius:12px;font-size:11px;display:none;white-space:nowrap}
#error{display:none;position:fixed;inset:0;place-items:center;text-align:center;padding:28px;background:#071c16;z-index:20;color:#effff5}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="game"></div>
<div id="loading"><div class="loadbox"><div class="crown">♛ ✦ ✦ ✦</div><div class="brand">SHOHIN ISLAND</div><div class="sub">A WORLD TO DISCOVER</div><div class="bar"></div></div></div>
<div id="hud">
 <div class="top"><div class="panel"><div class="logo">SHOHIN TAJIKISTAN</div><div class="location">SHOHIN ISLAND · OPEN WORLD</div></div><div class="panel status"><div>WORLD <b>5 × 5 KM</b></div><div id="coords">X 0 · Z 0</div></div></div>
 <div class="hint">Проведи пальцем по экрану, чтобы осмотреть остров</div><div id="cross"></div>
 <div id="controls"><div id="stick"><div id="nub"></div></div><div class="actions"><button class="act" id="view">ВИД</button><button class="act primary" id="jump">ПРЫЖОК</button></div></div>
</div>
<div id="notice"></div><div id="error"></div>
<script type="module">
import * as THREE from 'three';
const root=document.getElementById('game'),loading=document.getElementById('loading'),hud=document.getElementById('hud');
try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc9d4);scene.fog=new THREE.FogExp2(0x9bc9d4,.00165);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1800);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc8e8ff,0x38513a,1.7));
const sun=new THREE.DirectionalLight(0xffedcf,3.1);sun.position.set(-260,380,-180);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-320;sun.shadow.camera.right=320;sun.shadow.camera.top=320;sun.shadow.camera.bottom=-320;sun.shadow.bias=-.00025;scene.add(sun);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),new THREE.MeshStandardMaterial({color:0x167c91,roughness:.24,metalness:.18,transparent:true,opacity:.96}));sea.rotation.x=-Math.PI/2;sea.position.y=-2.8;scene.add(sea);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(x,z){let n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n)}
function noise(x,z){let ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz;fx=fx*fx*(3-2*fx);fz=fz*fz*(3-2*fz);return THREE.MathUtils.lerp(THREE.MathUtils.lerp(hash(ix,iz),hash(ix+1,iz),fx),THREE.MathUtils.lerp(hash(ix,iz+1),hash(ix+1,iz+1),fx),fz)}
function heightAt(x,z){
 const r=Math.sqrt(x*x+z*z),edge=clamp((242-r)/52,0,1);if(edge<=0)return -5;
 const n=noise(x*.035,z*.035)*10+noise(x*.09+30,z*.09-20)*3.2;
 const ridge=Math.max(0,1-Math.sqrt((x+55)**2/15000+(z-45)**2/19000));
 const ridge2=Math.max(0,1-Math.sqrt((x-85)**2/8500+(z+65)**2/11000));
 const central= Math.pow(ridge,1.6)*112+Math.pow(ridge2,1.7)*78;
 const peaks=Math.pow(Math.max(0,Math.sin(x*.018+z*.012)*Math.cos(z*.021-x*.009)),3)*16;
 return Math.max(-3,(7+n+central+peaks)*edge-2);
}
const N=190,size=500,positions=[],colors=[],indices=[];
const colorLow=new THREE.Color(0xc1ad78),colorGrass=new THREE.Color(0x47794a),colorForest=new THREE.Color(0x254e36),colorRock=new THREE.Color(0x777b75),colorSnow=new THREE.Color(0xe4e9e3);
for(let iz=0;iz<=N;iz++)for(let ix=0;ix<=N;ix++){
 const x=(ix/N-.5)*size,z=(iz/N-.5)*size,y=heightAt(x,z);positions.push(x,y,z);
 let c;if(y<2)c=colorLow.clone().lerp(colorGrass,clamp((y+2)/4,0,1));else if(y<34)c=colorGrass.clone().lerp(colorForest,clamp((y-2)/32,0,1));else if(y<92)c=colorForest.clone().lerp(colorRock,clamp((y-34)/58,0,1));else c=colorRock.clone().lerp(colorSnow,clamp((y-92)/34,0,1));
 const variation=(noise(x*.17,z*.17)-.5)*.12;c.offsetHSL(0,0,variation);colors.push(c.r,c.g,c.b);
 if(ix<N&&iz<N){const a=iz*(N+1)+ix,b=a+1,c=a+N+1,d=c+1;indices.push(a,c,b,b,c,d)}
}
const terrainGeo=new THREE.BufferGeometry();terrainGeo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));terrainGeo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));terrainGeo.setIndex(indices);terrainGeo.computeVertexNormals();
const terrain=new THREE.Mesh(terrainGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.94}));terrain.receiveShadow=true;terrain.castShadow=true;scene.add(terrain);
// Shoreline sand coves
const sandMat=new THREE.MeshStandardMaterial({color:0xc7b27c,roughness:1});
for(let i=0;i<8;i++){const a=i*Math.PI/4+.2,x=Math.cos(a)*190,z=Math.sin(a)*190;const patch=new THREE.Mesh(new THREE.CircleGeometry(19,32),sandMat);patch.rotation.x=-Math.PI/2;patch.rotation.z=-a;patch.position.set(x,heightAt(x,z)+.22,z);patch.scale.set(1.5,.75,1);scene.add(patch)}
// Instanced forests: tree counts tuned for mobile
const trunkGeo=new THREE.CylinderGeometry(.35,.55,5,6),leafGeo=new THREE.ConeGeometry(3.2,11,7);
const trunkMat=new THREE.MeshStandardMaterial({color:0x63452d,roughness:1}),leafMat=new THREE.MeshStandardMaterial({color:0x245a39,roughness:.95});
const trunks=new THREE.InstancedMesh(trunkGeo,trunkMat,1350),leaves=new THREE.InstancedMesh(leafGeo,leafMat,1350);trunks.castShadow=true;leaves.castShadow=true;
const dummy=new THREE.Object3D();let count=0,tries=0;
while(count<1350&&tries<12000){tries++;const x=(Math.random()-.5)*440,z=(Math.random()-.5)*440,y=heightAt(x,z);if(y<4||y>75||Math.sqrt(x*x+z*z)>222)continue;
const s=.7+Math.random()*.9;dummy.position.set(x,y+2.4*s,z);dummy.rotation.y=Math.random()*6.28;dummy.scale.set(s,s,s);dummy.updateMatrix();trunks.setMatrixAt(count,dummy.matrix);
dummy.position.y=y+7*s;dummy.scale.set(s,s,s);dummy.updateMatrix();leaves.setMatrixAt(count,dummy.matrix);count++}
trunks.count=count;leaves.count=count;scene.add(trunks,leaves);
// scattered boulders
const rockGeo=new THREE.DodecahedronGeometry(2.5,0),rockMat=new THREE.MeshStandardMaterial({color:0x777a73,roughness:1});const rocks=new THREE.InstancedMesh(rockGeo,rockMat,500);let rc=0;
for(let i=0;i<500;i++){const x=(Math.random()-.5)*420,z=(Math.random()-.5)*420,y=heightAt(x,z);if(y<3)continue;dummy.position.set(x,y+1,z);dummy.rotation.set(Math.random(),Math.random()*6,Math.random());const s=.4+Math.random()*2.4;dummy.scale.set(s,s*.6,s);dummy.updateMatrix();rocks.setMatrixAt(rc++,dummy.matrix)}rocks.count=rc;rocks.castShadow=true;scene.add(rocks);
// River ribbon descending from high valley toward coast
function makeRiver(points,width,material){const verts=[],idx=[];for(let i=0;i<points.length;i++){const p=points[i],prev=points[Math.max(0,i-1)],next=points[Math.min(points.length-1,i+1)],dx=next[0]-prev[0],dz=next[1]-prev[1],len=Math.hypot(dx,dz)||1,nx=-dz/len,nz=dx/len,y=heightAt(p[0],p[1])+.35;verts.push(p[0]+nx*width,y,p[1]+nz*width,p[0]-nx*width,y,p[1]-nz*width);if(i<points.length-1){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3)}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(idx);g.computeVertexNormals();const m=new THREE.Mesh(g,material);scene.add(m)}
const riverMat=new THREE.MeshStandardMaterial({color:0x42b7c3,roughness:.18,metalness:.15,transparent:true,opacity:.88,side:THREE.DoubleSide});
makeRiver([[-48,-18],[-35,10],[-22,38],[-4,67],[18,92],[35,122],[60,150],[88,174],[118,194]],3.5,riverMat);
makeRiver([[58,-80],[40,-55],[22,-32],[8,-8],[-8,16],[-20,42]],2.2,riverMat);
// waterfall in mountain valley
const waterfall=new THREE.Mesh(new THREE.PlaneGeometry(13,25),new THREE.MeshStandardMaterial({color:0x9ce8ec,transparent:true,opacity:.72,roughness:.15,side:THREE.DoubleSide,emissive:0x16434a}));waterfall.position.set(-4,55,68);waterfall.rotation.y=.15;scene.add(waterfall);
// soft clouds using translucent flattened spheres
const cloudMat=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.48,roughness:1,depthWrite:false});
for(let i=0;i<22;i++){const g=new THREE.Group();for(let j=0;j<4;j++){const puff=new THREE.Mesh(new THREE.SphereGeometry(1,9,7),cloudMat);puff.position.set((j-1.5)*8,Math.random()*3,Math.random()*4);puff.scale.set(8+Math.random()*5,2.4+Math.random()*1.6,4+Math.random()*3);g.add(puff)}g.position.set((Math.random()-.5)*700,100+Math.random()*65,(Math.random()-.5)*700);scene.add(g)}
// Player
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(1.15,3.2,4,8),new THREE.MeshStandardMaterial({color:0x173f31,roughness:.8}));body.position.y=3;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.85,12,10),new THREE.MeshStandardMaterial({color:0xc99570,roughness:.8}));head.position.y=5.4;head.castShadow=true;player.add(head);
const pack=new THREE.Mesh(new THREE.BoxGeometry(1.5,2,1),new THREE.MeshStandardMaterial({color:0x9a7b36,roughness:1}));pack.position.set(0,3.3,-.95);player.add(pack);player.position.set(0,heightAt(0,0),-12);scene.add(player);
let yaw=0,pitch=.18,third=true,vy=0,onGround=true;const move={x:0,y:0};let last=performance.now();
function updateCamera(){const dist=third?13:.2;const target=new THREE.Vector3(player.position.x,player.position.y+4.2,player.position.z);const offset=new THREE.Vector3(Math.sin(yaw)*dist,3.5+pitch*12,Math.cos(yaw)*dist);camera.position.copy(target).add(offset);camera.lookAt(target)}
updateCamera();
function movePlayer(dt){const speed=24;const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const dir=forward.multiplyScalar(-move.y).add(right.multiplyScalar(move.x));if(dir.lengthSq()>1)dir.normalize();player.position.addScaledVector(dir,speed*dt);const ground=heightAt(player.position.x,player.position.z);vy-=32*dt;player.position.y+=vy*dt;if(player.position.y<=ground){player.position.y=ground;vy=0;onGround=true}if(dir.lengthSq()>.001)player.rotation.y=Math.atan2(dir.x,dir.z);updateCamera();document.getElementById('coords').textContent='X '+Math.round(player.position.x*10)+' м · Z '+Math.round(player.position.z*10)+' м'}
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.04);last=now;movePlayer(dt);sea.position.y=-2.8+Math.sin(now*.00045)*.12;waterfall.material.opacity=.62+Math.sin(now*.006)*.1;renderer.render(scene,camera)}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight)});
const stick=document.getElementById('stick'),nub=document.getElementById('nub');let stickId=null;
function setStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=36,l=Math.hypot(dx,dy),k=l>max?max/l:1;move.x=dx*k/max;move.y=dy*k/max;nub.style.transform='translate('+dx*k+'px,'+dy*k+'px)'}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);setStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setStick(e)});function stopStick(){stickId=null;move.x=move.y=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);
let lookId=null,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<150&&e.clientY>innerHeight-180)return;lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(lookId)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.004;pitch=clamp(pitch-dy*.0025,-.4,.8)});renderer.domElement.addEventListener('pointerup',()=>lookId=null);renderer.domElement.addEventListener('pointercancel',()=>lookId=null);
document.getElementById('jump').addEventListener('click',()=>{if(onGround){vy=13;onGround=false}});document.getElementById('view').addEventListener('click',()=>{third=!third;body.visible=third;head.visible=third;pack.visible=third;document.getElementById('view').textContent=third?'ВИД':'ОБЗОР'});
addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')move.y=-1;if(e.key==='s'||e.key==='ArrowDown')move.y=1;if(e.key==='a'||e.key==='ArrowLeft')move.x=-1;if(e.key==='d'||e.key==='ArrowRight')move.x=1;if(e.code==='Space'&&onGround){vy=13;onGround=false}});addEventListener('keyup',e=>{if(['w','s','ArrowUp','ArrowDown'].includes(e.key))move.y=0;if(['a','d','ArrowLeft','ArrowRight'].includes(e.key))move.x=0});
loading.style.opacity='0';setTimeout(()=>{loading.remove();hud.style.display='block'},850);
}catch(err){document.getElementById('loading').style.display='none';const el=document.getElementById('error');el.style.display='grid';el.innerHTML='<div><h2>SHOHIN ISLAND</h2><p>Не удалось запустить 3D-графику. Обнови страницу или открой её в браузере с поддержкой WebGL.</p><small>'+String(err).replace(/[<>&]/g,'')+'</small></div>'}
</script>
</body></html>
