engine.runRenderLoop(()=>{const now=performance.now(),dt=Math.min((now-last)/1000,.04);last=now;updatePlayer(dt);const t=clamp((now-introStart)/3000,0,1);if(t<1&&!overview){const e=t*t*(3-2*t),target=new BABYLON.Vector3(playerRoot.position.x+Math.sin(yaw)*13,playerRoot.position.y+7.6+pitch*12,playerRoot.position.z+Math.cos(yaw)*13),look=new BABYLON.Vector3(playerRoot.position.x,playerRoot.position.y+4.2,playerRoot.position.z);camera.position.copyFrom(BABYLON.Vector3.Lerp(introFrom,target,e));camera.setTarget(BABYLON.Vector3.Lerp(BABYLON.Vector3.Zero(),look,e))}cloudGeo.rotation.y=now*.000015;scene.render()});
window.addEventListener('resize',()=>engine.resize());
const stick=document.getElementById('stick'),nub=document.getElementById('nub');let stickId=null;function setStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=36,l=Math.hypot(dx,dy),k=l>max?max/l:1;move.x=dx*k/max;move.y=dy*k/max;nub.style.transform='translate('+dx*k+'px,'+dy*k+'px)'}stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);setStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setStick(e)});function stopStick(){stickId=null;move.x=move.y=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);
const pointers=new Map();let lastPinch=0;function gap(){const p=[...pointers.values()];return p.length<2?0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}canvas.addEventListener('pointerdown',e=>{if(e.clientX<150&&e.clientY>innerHeight-180)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);if(pointers.size===2)lastPinch=gap()});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId),dx=e.clientX-old.x,dy=e.clientY-old.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(overview){if(pointers.size>1){const g=gap();if(lastPinch&&g)overviewDistance=clamp(overviewDistance*lastPinch/g,450,9000);lastPinch=g;updateCamera()}else{const scale=overviewDistance/innerHeight;camTarget.x-=dx*scale;camTarget.z-=dy*scale;updateCamera()}}else if(pointers.size===1){yaw-=dx*.004;pitch=clamp(pitch-dy*.0025,-.4,.8)}});function release(e){pointers.delete(e.pointerId);lastPinch=pointers.size===2?gap():0}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
document.getElementById('jump').onclick=()=>{if(onGround){vy=13;onGround=false}};document.getElementById('view').onclick=()=>{third=!third;body.isVisible=head.isVisible=pack.isVisible=third;document.getElementById('view').textContent=third?'3 ЛИЦО':'1 ЛИЦО';updateCamera()};document.getElementById('overview').onclick=()=>{overview=!overview;camTarget.set(0,0,0);overviewDistance=3200;document.getElementById('hint').textContent=overview?'ВИД СВЕРХУ · Перемещай одним пальцем, приближай двумя':'Проведи пальцем по экрану, чтобы осмотреть остров';updateCamera()};document.getElementById('zoomIn').onclick=()=>{if(overview){overviewDistance=clamp(overviewDistance*.72,450,9000);updateCamera()}};document.getElementById('zoomOut').onclick=()=>{if(overview){overviewDistance=clamp(overviewDistance/.72,450,9000);updateCamera()}};
window.addEventListener('keydown',e=>{if(e.code==='Space'&&onGround){vy=13;onGround=false}if(e.key==='w'||e.key==='ArrowUp')keys.w=true;if(e.key==='s'||e.key==='ArrowDown')keys.s=true;if(e.key==='a'||e.key==='ArrowLeft')keys.a=true;if(e.key==='d'||e.key==='ArrowRight')keys.d=true});window.addEventListener('keyup',e=>{if(e.key==='w'||e.key==='ArrowUp')keys.w=false;if(e.key==='s'||e.key==='ArrowDown')keys.s=false;if(e.key==='a'||e.key==='ArrowLeft')keys.a=false;if(e.key==='d'||e.key==='ArrowRight')keys.d=false});
